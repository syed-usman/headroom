name: macOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Headroom
        run: ./build.sh

      - name: Verify CLI Scan
        run: ./.build/headroom scan
